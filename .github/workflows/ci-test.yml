name: CI build and test

on:
  push:
    branches:
      - main
      - master
      - gh-actions-test
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qmake-build:
    name: Windows / qmake build + portable
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      QT_VERSION: 6.8.3
      QT_ARCH: win64_msvc2022_64
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for duplicate shortcuts
        run: python3 tools/check_shortcut_conflicts.py

      - name: Cache Qt installation
        id: cacheQt
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\Qt
          key: qt-${{ runner.os }}-${{ env.QT_VERSION }}-${{ env.QT_ARCH }}

      - name: Install Qt
        if: steps.cacheQt.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check aqtinstall==3.3.0
          python -m aqt install-qt windows desktop $env:QT_VERSION $env:QT_ARCH --outputdir "$env:RUNNER_TEMP\Qt"

      - name: Prepare FFTW 3.3.5 baseline
        shell: pwsh
        run: |
          $fftwRoot = "$env:RUNNER_TEMP\fftw"
          $rawRoot = "$env:RUNNER_TEMP\fftw-raw"
          Expand-Archive dev/windows/appveyor/fftw-3.3.5-dll64.zip $rawRoot
          New-Item -ItemType Directory -Force "$fftwRoot\include", "$fftwRoot\lib" | Out-Null
          Copy-Item "$rawRoot\fftw3.h" "$fftwRoot\include\fftw3.h"
          Copy-Item "$rawRoot\libfftw3-3.def" "$fftwRoot\lib\libfftw3-3.def"
          Copy-Item "$rawRoot\libfftw3-3.dll" "$fftwRoot\lib\libfftw3-3.dll"

      - name: Build application and translations
        shell: pwsh
        run: |
          .\dev\windows\build_qmake_qt6.ps1 `
            -QtRoot "$env:RUNNER_TEMP\Qt\$env:QT_VERSION\msvc2022_64" `
            -FftwRoot "$env:RUNNER_TEMP\fftw" `
            -BuildDirectory "$env:GITHUB_WORKSPACE\build-windows-ci" `
            -CompileTranslations

      - name: Verify build products
        shell: pwsh
        run: |
          Get-Item build-windows-ci\bin\Engauge.exe
          $expectedTranslations = @(
            'ar', 'cs', 'de', 'en', 'es', 'fa_IR', 'fr', 'hi', 'it',
            'ja', 'kk', 'ko', 'nb', 'nl', 'pt', 'ru', 'zh_CN', 'zh_TW'
          )
          $missingTranslations = $expectedTranslations | Where-Object {
            -not (Test-Path "translations\engauge_$_.qm")
          }
          if ($missingTranslations) {
            throw "Missing compiled translations: $($missingTranslations -join ', ')."
          }

  cmake-test:
    name: Windows / CMake build + 26 unit tests
    runs-on: windows-2022
    timeout-minutes: 45
    needs: qmake-build
    env:
      QT_VERSION: 6.8.3
      QT_ARCH: win64_msvc2022_64
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Qt installation
        id: cacheQt
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\Qt
          key: qt-${{ runner.os }}-${{ env.QT_VERSION }}-${{ env.QT_ARCH }}

      - name: Install Qt
        if: steps.cacheQt.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check aqtinstall==3.3.0
          python -m aqt install-qt windows desktop $env:QT_VERSION $env:QT_ARCH --outputdir "$env:RUNNER_TEMP\Qt"

      - name: Prepare FFTW 3.3.5 baseline
        shell: pwsh
        run: |
          $fftwRoot = "$env:RUNNER_TEMP\fftw"
          $rawRoot = "$env:RUNNER_TEMP\fftw-raw"
          Expand-Archive dev/windows/appveyor/fftw-3.3.5-dll64.zip $rawRoot
          New-Item -ItemType Directory -Force "$fftwRoot\include", "$fftwRoot\lib" | Out-Null
          Copy-Item "$rawRoot\fftw3.h" "$fftwRoot\include\fftw3.h"
          Copy-Item "$rawRoot\libfftw3-3.def" "$fftwRoot\lib\libfftw3-3.def"
          Copy-Item "$rawRoot\libfftw3-3.dll" "$fftwRoot\lib\libfftw3-3.dll"

      - name: Cache CMake build directory
        uses: actions/cache@v4
        with:
          path: cmake-build\windows-msvc-release
          # The key contains every source and build file hash, so a changed file recompiles while
          # untouched files reuse their objects from the restored cache
          key: cmake-build-${{ runner.os }}-${{ hashFiles('src/**', 'CMakeLists.txt', 'CMakePresets.json') }}
          restore-keys: |
            cmake-build-${{ runner.os }}-

      - name: Build parallel CMake application target
        shell: pwsh
        run: |
          $env:QT_ROOT = "$env:RUNNER_TEMP\Qt\$env:QT_VERSION\msvc2022_64"
          $env:FFTW_HOME = "$env:RUNNER_TEMP\fftw"
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $visualStudioRoot = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          & (Join-Path $visualStudioRoot "Common7\Tools\Launch-VsDevShell.ps1") `
            -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          $env:Path = "$env:QT_ROOT\bin;$env:Path"
          $env:QT_QPA_PLATFORM = "offscreen"
          # The qmake job used to create the FFTW import library as a side effect of its build, and
          # this job relied on that hidden dependency. Now that the two build in parallel jobs, the
          # import library has to be created here as well: FindFFTW3 needs libfftw3-3.lib, which the
          # zip does not contain (it ships the .def and the .dll)
          if (-not (Test-Path "$env:FFTW_HOME\lib\libfftw3-3.lib")) {
            lib.exe /NOLOGO /MACHINE:X64 "/DEF:$env:FFTW_HOME\lib\libfftw3-3.def" "/OUT:$env:FFTW_HOME\lib\libfftw3-3.lib"
            if ($LASTEXITCODE -ne 0) {
              throw "Creating the FFTW import library failed with exit code $LASTEXITCODE."
            }
          }
          cmake --preset windows-msvc-release
          cmake --build --preset windows-msvc-release
          # --output-on-failure so that a failing assertion is visible in the log instead of only
          # the test name: a failure that cannot be diagnosed costs a whole CI cycle
          ctest --preset windows-msvc-release --output-on-failure

      - name: Show unit test output when a test failed
        # The normal run keeps the log short. When something fails, this re-runs the suite verbosely
        # so the assertion that failed is in the log instead of only the test name.
        if: failure()
        shell: pwsh
        run: |
          # The tests are already built, so the Visual Studio environment is not needed here.
          # QT_ROOT is only exported inside the build step, so it is computed again here: without
          # this the tests all fail with 0xc0000135 (DLL not found) and the re-run shows nothing
          # about the failure it is meant to explain.
          $env:QT_ROOT = "$env:RUNNER_TEMP\Qt\$env:QT_VERSION\msvc2022_64"
          $env:Path = "$env:QT_ROOT\bin;$env:Path"
          $env:QT_QPA_PLATFORM = "offscreen"
          ctest --preset windows-msvc-release -V

          # And once more for the tests that failed, verbosely. This reruns only the failures, which
          # is the shortest path to the assertion text if the full verbose run is too noisy to read.
          ctest --preset windows-msvc-release --rerun-failed -V

          # Direct run of every failing test binary, without ctest in between. ctest swallows or
          # summarizes the child output in some failure modes (a crash before the test framework
          # writes anything, for example), so this is the ground truth: everything the test writes
          # and its raw exit code.
          $testList = ctest --preset windows-msvc-release --rerun-failed -N |
            Select-String -Pattern "Test\s+#\d+:\s+unit\.(\S+)" |
            ForEach-Object { $_.Matches[0].Groups[1].Value } |
            Sort-Object -Unique
          foreach ($testName in $testList) {
            # The captured name is already the executable name (unit.TestQualityReport ->
            # TestQualityReport), so it must not get a second Test prefix
            $exe = Join-Path (Join-Path (Get-Location) "cmake-build\windows-msvc-release\bin") "$testName.exe"
            Write-Host "===== direct: $exe"
            # Capture through cmd redirection into files, then read the files back. The pipeline
            # between a native exe and PowerShell has dropped this output twice already; cmd
            # redirection is the most primitive capture there is.
            $outFile = Join-Path $env:RUNNER_TEMP "$testName.out"
            $errFile = Join-Path $env:RUNNER_TEMP "$testName.err"
            $qtestFile = Join-Path $env:RUNNER_TEMP "$testName.qtestlog.txt"
            cmd /c "$exe -o $qtestFile,txt > $outFile 2> $errFile"
            Write-Host "===== exit code: $LASTEXITCODE"
            Write-Host "===== stdout ($(Get-Item $outFile | Select-Object -ExpandProperty Length) bytes):"
            Get-Content $outFile | ForEach-Object { Write-Host $_ }
            Write-Host "===== stderr ($(Get-Item $errFile | Select-Object -ExpandProperty Length) bytes):"
            Get-Content $errFile | ForEach-Object { Write-Host $_ }
            if (Test-Path $qtestFile) {
              Write-Host "===== qtest log ($(Get-Item $qtestFile | Select-Object -ExpandProperty Length) bytes):"
              Get-Content $qtestFile | ForEach-Object { Write-Host $_ }
            }
          }

      - name: Verify CMake build products
        shell: pwsh
        run: |
          Get-Item cmake-build\windows-msvc-release\bin\Engauge.exe
          Get-Item cmake-build\windows-msvc-release\bin\libfftw3-3.dll
          $cmakeTranslations = Get-ChildItem `
            cmake-build\windows-msvc-release\bin\translations\engauge_*.qm
          if ($cmakeTranslations.Count -ne 18) {
            throw "Expected 18 CMake translation catalogs, found $($cmakeTranslations.Count)."
          }

          Get-Item cmake-build\windows-msvc-release\bin\documentation\engauge.qch
          Get-Item cmake-build\windows-msvc-release\bin\documentation\engauge.qhc

      - name: Assemble and verify portable deployment
        shell: pwsh
        run: |
          # QT_ROOT was only exported inside the previous step, and step-level
          # environment variables do not carry over, so windeployqt was resolved as
          # "\bin\windeployqt.exe" and this step failed.
          $env:QT_ROOT = "$env:RUNNER_TEMP\Qt\$env:QT_VERSION\msvc2022_64"
          $portableRoot = [System.IO.Path]::GetFullPath(
            (Join-Path $env:RUNNER_TEMP 'Engauge Digitizer Multilingual'))
          $tempPrefix = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\') + '\'
          if (-not $portableRoot.StartsWith(
              $tempPrefix,
              [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "Portable staging path escaped the runner temp directory."
          }
          if (Test-Path $portableRoot) {
            Remove-Item -LiteralPath $portableRoot -Recurse -Force
          }

          cmake --install cmake-build\windows-msvc-release `
            --prefix $portableRoot `
            --config Release
          & "$env:QT_ROOT\bin\windeployqt.exe" `
            --release `
            --compiler-runtime `
            --dir $portableRoot `
            "$portableRoot\Engauge.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "windeployqt failed with exit code $LASTEXITCODE."
          }

          $requiredProducts = @(
            'Engauge.exe',
            'libfftw3-3.dll',
            'Qt6Core.dll',
            'Qt6Help.dll',
            'Qt6Widgets.dll',
            'platforms\qwindows.dll',
            'documentation\engauge.qch',
            'documentation\engauge.qhc',
            'translations\qt_zh_CN.qm',
            'translations\qt_zh_TW.qm',
            'LICENSE',
            'THIRD-PARTY-NOTICES.md',
            'licenses\LGPL-3.0.txt'
          )
          $missingProducts = $requiredProducts | Where-Object {
            -not (Test-Path (Join-Path $portableRoot $_) -PathType Leaf)
          }
          if ($missingProducts) {
            throw "Missing portable products: $($missingProducts -join ', ')."
          }

          foreach ($qtTranslation in @('qt_zh_CN.qm', 'qt_zh_TW.qm')) {
            $qtTranslationFile = Get-Item `
              "$portableRoot\translations\$qtTranslation"
            if ($qtTranslationFile.Length -lt 100000) {
              throw "Qt translation was not fully deployed: $qtTranslation"
            }
          }

          $portableTranslations = Get-ChildItem `
            "$portableRoot\translations\engauge_*.qm"
          if ($portableTranslations.Count -ne 18) {
            throw "Expected 18 portable translations, found $($portableTranslations.Count)."
          }

          $archive = Join-Path $env:RUNNER_TEMP `
            'Engauge-Digitizer-12.11.4-Windows-x64-Portable.zip'
          Compress-Archive `
            -Path (Join-Path $portableRoot '*') `
            -DestinationPath $archive `
            -CompressionLevel Optimal

          .\dev\windows\test_portable_regression.ps1 `
            -PortableRoot $portableRoot

      - name: Upload Windows portable package
        uses: actions/upload-artifact@v4
        with:
          name: Engauge-Digitizer-12.11.4-Windows-x64-Portable
          path: ${{ runner.temp }}/Engauge-Digitizer-12.11.4-Windows-x64-Portable.zip
          if-no-files-found: error
